<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkers Engine Test Board</title>
  <link rel="stylesheet" href="board.css">
  <script src="board.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>Checkers engine test board</h1>
      <p class="hint">Click a piece, then each square it lands on; the engine answers for the other side.</p>
    </header>
    <div id="board" class="board" aria-label="Board"></div>
    <section class="panel">
      <p id="status" class="status" role="status"></p>
      <form id="position-form">
        <label class="wide">Position (PDN)
          <input id="position" value="B:W21-32:B1-12" required spellcheck="false">
        </label>
        <button type="submit" class="secondary">Load</button>
      </form>
      <form id="suggest-form">
        <label>Level
          <select id="level">
            <option value="">default</option>
            <option value="weak">weak</option>
            <option value="medium">medium</option>
            <option value="strong">strong</option>
          </select>
        </label>
        <button type="submit">Engine move</button>
        <button type="button" id="new-game" class="secondary">New game</button>
      </form>
      <dl id="suggestion"></dl>
      <form id="validate-form">
        <label>Move
          <input id="move" placeholder="11-15" required spellcheck="false">
        </label>
        <button type="submit" class="secondary">Validate</button>
        <output id="validation"></output>
      </form>
      <p id="error" class="error" role="alert"></p>
    </section>
  </main>
</body>
</html>
