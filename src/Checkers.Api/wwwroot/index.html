<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkers Engine Test Board</title>
  <link rel="stylesheet" href="board.css">
  <script src="board.js" defer></script>
</head>
<body>
  <main>
    <h1>Checkers engine test board</h1>
    <form id="suggest-form">
      <label>Position (PDN)
        <input id="position" value="B:W18,19,22,25,27,28,30,32:B1,5,6,7,10,12,14,16" required>
      </label>
      <label>Level
        <select id="level">
          <option value="">default</option>
          <option value="weak">weak</option>
          <option value="medium">medium</option>
          <option value="strong">strong</option>
        </select>
      </label>
      <button type="submit">Suggest</button>
    </form>
    <div id="board" class="board" aria-label="Board"></div>
    <dl id="suggestion"></dl>
    <form id="validate-form">
      <label>Move
        <input id="move" placeholder="16x23" required>
      </label>
      <button type="submit">Validate</button>
      <output id="validation"></output>
    </form>
    <p id="error" class="error" role="alert"></p>
  </main>
</body>
</html>
